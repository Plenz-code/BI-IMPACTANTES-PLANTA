# .github/workflows/update_bi.yml
#
# Atualiza o BI automaticamente quando a planilha do SharePoint muda.
#
# Dois modos de disparo:
#   1. workflow_dispatch (via webhook do Power Automate) → atualiza na hora
#   2. schedule (fallback a cada 30 min) → garante atualização mesmo sem Power Automate
#
# Secrets necessários (Settings → Secrets → Actions):
#   SP_TENANT_ID, SP_CLIENT_ID, SP_CLIENT_SECRET
#   SP_SITE_URL  (ex: https://harpiagold.sharepoint.com/sites/Producao)
#   SP_FILE_PATH (ex: /Shared Documents/Geral/Planilha_producao.xlsx)

name: Atualizar BI

on:
  workflow_dispatch:        # chamado pelo Power Automate quando o arquivo muda
  schedule:
    - cron: '*/30 * * * *' # fallback: roda a cada 30 minutos

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests openpyxl

      - name: Baixar planilha e atualizar BI
        env:
          SP_TENANT_ID:     ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID:     ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          SP_SITE_URL:      ${{ secrets.SP_SITE_URL }}
          SP_FILE_PATH:     ${{ secrets.SP_FILE_PATH }}
        run: python scripts/update_bi.py

      - name: Commit e push se houver mudança
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add index.html
          if git diff --staged --quiet; then
            echo "Sem mudanças nos dados — nada a commitar."
          else
            TIMESTAMP=$(date -u '+%d/%m/%Y %H:%M UTC')
            git commit -m "🔄 BI atualizado automaticamente — ${TIMESTAMP}"
            git push
            echo "✅ index.html atualizado e publicado."
          fi

