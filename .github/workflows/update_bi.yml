name: Atualizar BI

on:
  repository_dispatch:
    types: [planilha-atualizada]
  push:
    paths:
      - 'planilha.xlsx'
  schedule:
    - cron: '0 */6 * * *'  # rede de seguranca — gatilho principal e o repository_dispatch
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Mostrar qual gatilho disparou esta execucao
        run: echo "Disparado por -> ${{ github.event_name }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install openpyxl

      - name: Baixar planilha do Dropbox
        env:
          DROPBOX_URL: ${{ secrets.DROPBOX_URL }}
        run: python scripts/update_bi_tudo.py

      - name: Publicar planilha.xlsx
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add planilha.xlsx
          if git diff --staged --quiet; then
            echo "Planilha sem mudanças — nada a commitar."
          else
            TIMESTAMP=$(date -u '+%d/%m/%Y %H:%M UTC')
            git commit -m "planilha atualizada - ${TIMESTAMP} (via ${{ github.event_name }})"
            git push
          fi
