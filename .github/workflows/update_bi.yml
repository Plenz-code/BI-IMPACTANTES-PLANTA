name: Atualizar BI

on:
  repository_dispatch:
    types: [planilha-atualizada]
  push:
    paths:
      - 'planilha.xlsx'
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install Office365-REST-Python-Client openpyxl

      - name: Baixar planilha via API GitHub (binario puro)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c "
import urllib.request, base64, json, os, sys
token = os.environ['GH_TOKEN']
repo  = os.environ['REPO']
url   = f'https://api.github.com/repos/{repo}/contents/planilha.xlsx'
req   = urllib.request.Request(url, headers={
    'Authorization': f'Bearer {token}',
    'Accept': 'application/vnd.github+json'
})
try:
    with urllib.request.urlopen(req) as resp:
        data = json.loads(resp.read())
    content = base64.b64decode(data['content'].replace('\n',''))
    with open('planilha.xlsx','wb') as f:
        f.write(content)
    print(f'Planilha baixada da API GitHub ({len(content)//1024} KB)')
except Exception as e:
    print(f'Erro ao baixar da API: {e}')
    sys.exit(1)
"

      - name: Processar e atualizar BI
        env:
          SP_USERNAME:  ${{ secrets.SP_USERNAME }}
          SP_PASSWORD:  ${{ secrets.SP_PASSWORD }}
          SP_SITE_URL:  ${{ secrets.SP_SITE_URL }}
          SP_FILE_PATH: ${{ secrets.SP_FILE_PATH }}
        run: python scripts/update_bi_tudo.py

      - name: Publicar index.html
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add index.html
          if git diff --staged --quiet; then
            echo "Sem mudancas."
          else
            TIMESTAMP=$(date -u '+%d/%m/%Y %H:%M UTC')
            git commit -m "BI atualizado — ${TIMESTAMP}"
            git push
          fi
