name: Atualizar BI

on:
  repository_dispatch:
    types: [planilha-atualizada]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Salvar planilha do payload
        env:
          PLANILHA_B64: ${{ github.event.client_payload.content }}
        run: |
          echo "$PLANILHA_B64" | base64 -d > planilha.xlsx
          echo "✓ planilha.xlsx salva ($(du -sh planilha.xlsx | cut -f1))"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install openpyxl

      - name: Processar e atualizar BI
        run: python scripts/update_bi.py

      - name: Publicar index.html
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add index.html
          if git diff --staged --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "🔄 BI atualizado — $(date -u '+%d/%m/%Y %H:%M UTC')"
            git push
          fi
